apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kestra-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: kestra-mcp
    app.kubernetes.io/part-of: kestra-mcp
spec:
  parentRefs:
    - name: kestra-mcp
      namespace: default
  hostnames:
    - kestra-mcp.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kestra-mcp
          port: 8081
