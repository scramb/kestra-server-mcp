apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kestra-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: kestra-mcp
    app.kubernetes.io/part-of: kestra-mcp
  annotations:
    # Uncomment for cert-manager integration:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kestra-mcp.example.com
      secretName: kestra-mcp-tls
  rules:
    - host: kestra-mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kestra-mcp
                port:
                  number: 8081
