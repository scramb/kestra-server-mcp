# Gateway API — requires a Gateway Controller in the cluster (e.g. Istio, Envoy Gateway, NGINX Gateway Fabric).
# DISABLED by default. Apply this only if your cluster supports Gateway API.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kestra-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: kestra-mcp
    app.kubernetes.io/part-of: kestra-mcp
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: kestra-mcp-tls
      allowedRoutes:
        namespaces:
          from: Same
