{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "kestra-mcp.fullname" . }}
  labels:
    {{- include "kestra-mcp.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: {{ .Values.gateway.listeners.http.protocol }}
      port: {{ .Values.gateway.listeners.http.port }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: {{ .Values.gateway.listeners.https.protocol }}
      port: {{ .Values.gateway.listeners.https.port }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.listeners.https.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
